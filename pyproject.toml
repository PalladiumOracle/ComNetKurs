[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2p-overlay"
version = "0.1.0"
description = "Защищённая оверлейная сеть на основе пиринговых протоколов"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"